<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="wt wd">
<title id="wt">The building blocks of a run</title>
<desc id="wd">Six building blocks in a line, each one section of the run config. Prepare: the JSON config and the datasets. Train: training windows with every event labelled, the model, training with validation every epoch; hpo repeats this stage with tuned values. Deliver: the best epoch as a SeisBench model with its thresholds. MLflow tracking records every block.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d38"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" fill-opacity=".045"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
<marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><linearGradient id="rulePREPARE" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".05"/></linearGradient><linearGradient id="ruleTRAIN" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".05"/></linearGradient><linearGradient id="ruleDELIVER" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".9"/><stop offset="1" stop-color="#34d399" stop-opacity=".05"/></linearGradient>
</defs>
<style>
.h{font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.18em}
.t{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f1f5f9}
.d{font:400 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#a8b5cc}
.s{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#cbd5e1}
.k{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.node{fill:#111a33;stroke-opacity:.4;stroke-width:1.2}
.flow{fill:none;stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round;animation:flow 1.4s linear infinite}
.loop{fill:none;stroke:#a78bfa;stroke-width:1.6;stroke-dasharray:5 6;stroke-opacity:.8;animation:flow 1.4s linear infinite}
.rail{fill:none;stroke:#34d399;stroke-opacity:.35;stroke-width:2}
.railflow{fill:none;stroke:#34d399;stroke-width:2;stroke-dasharray:2 22;stroke-linecap:round;animation:flow 1.4s linear infinite}
.tap{stroke:#34d399;stroke-opacity:.35;stroke-width:1.4;stroke-dasharray:2 4}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.flow,.loop,.railflow{animation:none}}
</style>
<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<rect width="1200" height="420" rx="18" fill="url(#dots)"/>
<text class="h" x="22.0" y="44" fill="#38bdf8">PREPARE</text>
<rect x="22.0" y="54" width="372.0" height="2" rx="1" fill="url(#rulePREPARE)"/>
<text class="h" x="414.0" y="44" fill="#a78bfa">TRAIN</text>
<rect x="414.0" y="54" width="568.0" height="2" rx="1" fill="url(#ruleTRAIN)"/>
