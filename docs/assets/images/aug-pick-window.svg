<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d">
<title id="t">pick_window</title>
<desc id="d">A 140 s trace with three events. pick_window selects one pick at random and cuts a 60 s context window that starts 30 s before it; the animation shows the window for different selected picks.</desc>
