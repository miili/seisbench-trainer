[project]
name = "seisbench-trainer"
dynamic = ["version"]
description = "Training, evaluation and hyperparameter optimisation workbench for SeisBench phase pickers, tracked with MLflow"
readme = "README.md"
authors = [
    { name = "Marius Paul Isken", email = "marius.isken@gfz.de" }
]
requires-python = ">=3.13"
dependencies = [
    "lightning>=2.5",
    "matplotlib>=3.10",
    "mlflow>=3.7,<4",
    "numpy>=2.0",
    "nvidia-ml-py>=13.615.71",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pydantic>=2.11",
    "rich>=14.0",
    "scipy>=1.14",
    "seisbench>=0.10",
    "torch>=2.8",
    "typer>=0.17",
]

[project.urls]
Documentation = "https://miili.github.io/seisbench-trainer/"
Repository = "https://github.com/miili/seisbench-trainer"

[project.optional-dependencies]
hpo = [
    "optuna>=4.5",
    "optuna-integration>=4.5",
]

[project.scripts]
seisbench-trainer = "seisbench_trainer.cli:app"

[dependency-groups]
dev = [
    # the hpo extra, so the tests see optuna
    "optuna>=4.5",
    "optuna-integration>=4.5",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.13",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

# The version comes from git: the last tag, the commits since, the commit
# hash, and a date suffix if the tree is dirty (e.g. 0.1.dev12+gfd3a09e.d20261112).
[tool.setuptools_scm]

[tool.uv]
# rebuild the editable install when the commit or the tags change, so that
# the installed version (and with it the logged commit) stays current
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Laptop development: CPU-only torch wheels. `pip install -e .` on the
# cluster (conda) ignores this section.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

# typographic dashes and minus signs in figure text
allowed-confusables = ["–", "−"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
