# Documentation site, built with Zensical (https://zensical.org).
#   uvx zensical serve     preview at http://localhost:8000
#   uvx zensical build     the site in ./site
# Published to GitHub Pages by .github/workflows/docs.yml.

[project]
site_name = "seisbench-trainer"
site_description = "Train, evaluate and tune SeisBench phase pickers, tracked in MLflow"
site_url = "https://miili.github.io/seisbench-trainer/"
repo_url = "https://github.com/miili/seisbench-trainer"
repo_name = "miili/seisbench-trainer"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Configuration" = "guide/configuration.md" },
    { "Data" = "guide/data.md" },
    { "Labels" = "guide/labels.md" },
    { "Training" = "guide/training.md" },
    { "Evaluation" = "guide/evaluation.md" },
    { "Tracking and models" = "guide/tracking.md" },
    { "Hyperparameter search" = "guide/hpo.md" },
    { "Slurm cluster" = "guide/cluster.md" },
    { "Scripts and agents" = "guide/automation.md" },
  ] },
  { "Reference" = [
    { "Config" = "reference/config.md" },
    { "CLI" = "reference/cli.md" },
  ] },
  { "Findings" = [
    { "Summary" = "findings.md" },
    { "Experiment log" = "experiments.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development.md" },
    { "Requirements" = "requirements.md" },
    { "Implementation plan" = "plan.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
