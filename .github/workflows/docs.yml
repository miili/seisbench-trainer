# Publish the documentation to GitHub Pages when a commit on main is tagged
# with a version (v*, e.g. v0.2.0); the tag is also the package version.
# Enable Pages once: Settings -> Pages -> Source: GitHub Actions.
# The config and CLI reference pages are generated and committed
# (scripts/gen_reference.py), so the build needs only Zensical.
name: Documentation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main; docs are published from main only"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
